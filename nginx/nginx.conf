# ============================================================
#  AquaWash — Configuração Nginx
#  - Proxy reverso para frontend e backend
#  - Redirecionamento HTTP → HTTPS
#  - Rate limiting por IP
#  - Cabeçalhos de segurança HTTP
#  - Certificado local via mkcert
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ----------------------------------------------------------
    #  Logs com formato detalhado (inclui tempo de resposta)
    # ----------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ----------------------------------------------------------
    #  Rate Limiting — protege a API contra abuso
    #  Zona de 10 MB suporta ~160k IPs simultâneos
    #  Limite: 30 requisições/segundo por IP
    # ----------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # ----------------------------------------------------------
    #  Upstreams nomeados — facilita troca de endereço sem
    #  alterar os blocos location; base para múltiplas instâncias
    # ----------------------------------------------------------
    upstream backend_upstream {
        server backend:3001;
        keepalive 32;           # reusar conexões TCP com o backend
    }

    upstream frontend_upstream {
        server frontend:80;
        keepalive 16;
    }

    # ----------------------------------------------------------
    #  Servidor HTTP — redireciona tudo para HTTPS (porta 443)
    # ----------------------------------------------------------
    server {
        listen 80;
        server_name meuapp.local;

        # Permite health check sem redirect (útil para load balancers)
        location /health {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Redireciona todo o resto para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------------------------------
    #  Servidor HTTPS — proxy reverso principal
    # ----------------------------------------------------------
    server {
        listen 443 ssl;
        server_name meuapp.local;

        # --- Certificados gerados com mkcert ---
        ssl_certificate     /etc/nginx/certs/meuapp.local.pem;
        ssl_certificate_key /etc/nginx/certs/meuapp.local-key.pem;

        # --- Protocolos e cifras seguras ---
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ----------------------------------------------------------
        #  Cabeçalhos de segurança HTTP
        # ----------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "
            default-src 'self';
            script-src  'self' 'unsafe-inline';
            style-src   'self' 'unsafe-inline';
            img-src     'self' data:;
            font-src    'self';
            connect-src 'self';
            frame-ancestors 'self';
        " always;

        # ----------------------------------------------------------
        #  Proxy para autenticação — rate limit restritivo
        #  Máx 5 req/s com burst de 10 (login, register)
        # ----------------------------------------------------------
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ----------------------------------------------------------
        #  Proxy para o Backend — /api/*
        #  Rate limit geral: 30 req/s com burst de 60
        # ----------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 6M;
        }

        # ----------------------------------------------------------
        #  Health check — sem rate limit, sem redirect
        # ----------------------------------------------------------
        location /health {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log off;
        }

        # ----------------------------------------------------------
        #  Proxy para arquivos de upload — /uploads/*
        #  Cache de 7 dias para imagens estáticas
        # ----------------------------------------------------------
        location /uploads/ {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # ----------------------------------------------------------
        #  Proxy para o Frontend — tudo o mais
        #  Suporte a SPA (React Router): fallback para index.html
        # ----------------------------------------------------------
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 = @frontend_fallback;
        }

        location @frontend_fallback {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
        }
    }
}
