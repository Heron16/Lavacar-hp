# ============================================================
#  AquaWash — Docker Compose
#  Serviços: mysql, backend, frontend, nginx
#  Acesso: https://meuapp.local (porta 443)
# ============================================================

services:

  # ----------------------------------------------------------
  #  Cache — Redis
  # ----------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: aquawash_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------
  #  Banco de dados MySQL
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: aquawash_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql          # persistência dos dados
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  #  Backend — Express + Sequelize
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquawash_backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,https://meuapp.local}
    volumes:
      - uploads_data:/app/uploads          # persistência das fotos de perfil
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "3002:3001"

  # ----------------------------------------------------------
  #  Notification Service — Microsserviço de notificações
  #  Consome eventos do Redis Pub/Sub publicados pelo backend.
  #  Processo independente: sem porta HTTP exposta.
  # ----------------------------------------------------------
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: aquawash_notifications
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  # ----------------------------------------------------------
  #  Frontend — React (build estático servido pelo Nginx)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: aquawash_frontend
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "5174:80"    # acesse http://localhost:5174 no browser
    expose:
      - "80"

  # ----------------------------------------------------------
  #  Nginx — proxy reverso + HTTPS + headers de segurança
  #  ÚNICO serviço exposto ao host (portas 80 e 443)
  # ----------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: aquawash_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - internal

# ============================================================
#  Volumes — persistência de dados
# ============================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local          # fotos de perfil dos usuários

# ============================================================
#  Redes — isolamento: apenas nginx exposto ao host
# ============================================================
networks:
  internal:
    driver: bridge
    internal: false       # nginx precisa de acesso externo para TLS handshake
